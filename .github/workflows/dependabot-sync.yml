name: Dependabot Sync

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-sync:
    uses: getquario/meta/.github/workflows/dependabot-sync.yml@main
    with:
      repo_name: ${{ github.event.repository.name }}
    secrets:
      QUARIO_META_TOKEN: ${{ secrets.QUARIO_META_TOKEN }}
