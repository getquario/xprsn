name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    uses: getquario/meta/.github/workflows/release-please.yml@main
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
